name: "Ultra-Sync-Final-v4"

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pyzipper

      - name: Process Core Extraction & Header Injection
        env:
          ZIP_PWD: ${{ secrets.ZIP_PWD }}
        run: |
          python3 - << 'EOF'
          import pyzipper, os, json, sys

          # 1. Extraction Logic
          try:
              with pyzipper.AESZipFile("toffee.zip", 'r') as zf:
                  zf.setpassword(os.environ.get("ZIP_PWD").encode())
                  zf.extractall(path=".")
              print("[+] Extraction Success")
          except Exception as e:
              print(f"[-] Extraction Failed: {e}")
              sys.exit(0)

          # 2. Playlist Generator with Raw Headlines
          if os.path.exists("api.json"):
              with open("api.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              
              # আপনার র (Raw) টেক্সট হেডলাইন
              # এটি #EXTM3U এর ঠিক নিচে থাকবে এবং চ্যানেল হিসেবে আসবে না
              m3u_output = "#EXTM3U\n"
              m3u_output += "# Creator : Asim Dipto\n"
              m3u_output += "# Fuck you Ankita\n\n"
              
              for ch in data:
                  name = ch.get("name")
                  link = ch.get("link")
                  logo = ch.get("logo", "")
                  cat = ch.get("category_name", "Live TV")
                  ck = ch.get("cookie", "")

                  if name and link:
                      m3u_output += f'#EXTINF:-1 group-title="{cat}" tvg-logo="{logo}", {name}\n'
                      m3u_output += f'#EXTVLCOPT:http-user-agent=Toffee (Linux;Android 14)\n'
                      if ck:
                          m3u_output += f'#EXTVLCOPT:http-cookie={ck}\n'
                      m3u_output += f'{link}\n\n'

              # দুই ফাইলে সেভ করা
              for filename in ["Toffee_NS_Player.m3u", "Toffee_Ott_Navigator.m3u"]:
                  with open(filename, "w", encoding="utf-8") as f:
                      f.write(m3u_output)
              print("[+] Headlines Injected Successfully")
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "System-Auto-Bot"
          git add .
          git diff-index --quiet HEAD || (git commit -m "System Update: $(date)" && git push origin main)
