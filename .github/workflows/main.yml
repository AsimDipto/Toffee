name: Stream Sync Pro

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  core-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pyzipper

      - name: Process Double Layer Assets
        env:
          ZIP_PWD: ${{ secrets.ZIP_PWD }}
        run: |
          python3 - << 'EOF'
          import requests, json, os, sys, pyzipper

          # Configuration
          OUT_DIR = "."
          FIRST_ZIP = "toffee_update.zip" 
          INNER_ZIP = "toffee_update.zip" 
          LOCAL_DB = "api.json"
          UA_MOBILE = "Toffee (Linux;Android 14)"

          def run_sync():
              pwd = os.environ.get("ZIP_PWD")
              if not pwd:
                  print("[-] Security Error: ZIP_PWD secret missing.")
                  sys.exit(1)

              try:
                  # Layer 1: Decrypt Outer Zip
                  if os.path.exists(FIRST_ZIP):
                      print(f"[*] Decrypting {FIRST_ZIP}...")
                      with pyzipper.AESZipFile(FIRST_ZIP, 'r') as zf:
                          zf.setpassword(pwd.encode())
                          zf.extractall(path=OUT_DIR)
                  
                  # Layer 2: Decrypt Inner Zip
                  if os.path.exists(INNER_ZIP):
                      print(f"[*] Decrypting {INNER_ZIP}...")
                      with pyzipper.AESZipFile(INNER_ZIP, 'r') as zf:
                          zf.setpassword(pwd.encode())
                          zf.extractall(path=OUT_DIR)
                  else:
                      print("[-] Error: Inner zip not found.")
                      sys.exit(1)

                  # Processing Logic
                  response = requests.get("https://apis.allinonedev.top/tf/", timeout=25)
                  session_key = response.json().get("set_cookie", "")
                  
                  if not session_key or not os.path.exists(LOCAL_DB):
                      print("[-] Error: Requirements missing.")
                      return

                  with open(LOCAL_DB, "r", encoding="utf-8") as f:
                      stream_list = json.load(f)

                  m3u_content = "#EXTM3U\n"
                  for item in stream_list:
                      url = item.get("link")
                      if not url: continue
                      m3u_content += f'#EXTINF:-1 group-title="{item.get("category_name")}" tvg-logo="{item.get("logo")}", {item.get("name")}\n'
                      m3u_content += f'#EXTVLCOPT:http-user-agent={UA_MOBILE}\n'
                      m3u_content += f'#EXTVLCOPT:http-cookie={session_key}\n'
                      m3u_content += f'{url}\n\n'

                  with open("Toffee_NS_Player.m3u", "w", encoding="utf-8") as f: f.write(m3u_content)
                  with open("Toffee_Ott_Navigator.m3u", "w", encoding="utf-8") as f: f.write(m3u_content)

                  # Final Cleanup
                  temp_files = [INNER_ZIP, "api.json", "run.py", "cookie.json", "requirements.txt"]
                  for f in temp_files:
                      if os.path.exists(f): os.remove(f)
                  
                  print("[+] Sync successful and secure.")

              except Exception as e:
                  print(f"[!] Critical Error: {e}")
                  sys.exit(1)

          if __name__ == "__main__":
              run_sync()
          EOF

      - name: Commit and Broadcast
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Sync Bot"
          git add Toffee_NS_Player.m3u Toffee_Ott_Navigator.m3u
          git diff-index --quiet HEAD || (git commit -m "System Update: $(date +'%Y-%m-%d %H:%M')" && git push origin main)
