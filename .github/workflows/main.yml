name: "Stream Sync Pro - Secured"

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  core-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pyzipper

      - name: Decrypt and Process Assets
        env:
          ZIP_PWD: ${{ secrets.ZIP_PWD }}
          SOURCE_URL: "https://apis.allinonedev.top/tf/"
          UA_MOBILE: "Toffee (Linux;Android 14)"
        run: |
          python3 - << 'EOF'
          import requests, json, os, sys, pyzipper

          def run_secured_sync():
              zip_file = "toffe_up.zip"
              out_dir = "."
              password = os.environ.get("ZIP_PWD")

              if not password:
                  print("[-] Security Error: ZIP_PWD not set.")
                  sys.exit(1)

              if not os.path.exists(zip_file):
                  print(f"[-] Error: {zip_file} not found.")
                  sys.exit(1)

              try:
                  # Extraction phase
                  with pyzipper.AESZipFile(zip_file, 'r') as zf:
                      zf.setpassword(password.encode())
                      zf.extractall(path=out_dir)
                  
                  data_file = "api.json" 
                  if not os.path.exists(data_file):
                      print("[-] Error: api.json missing.")
                      return

                  # Fetch session token
                  source_url = os.environ.get("SOURCE_URL")
                  response = requests.get(source_url, timeout=25)
                  session_key = response.json().get("set_cookie", "")
                  
                  if not session_key:
                      print("[-] Auth Error: Session key failed.")
                      return

                  with open(data_file, "r", encoding="utf-8") as f:
                      stream_list = json.load(f)

                  vlc_json_data = []
                  m3u_final = "#EXTM3U\n\n"

                  for item in stream_list:
                      url = item.get("link")
                      if not url: continue

                      title = item.get("name", "Unknown")
                      thumb = item.get("logo", "")
                      genre = item.get("category_name", "General")

                      # Add to JSON list for channels.json compatibility
                      vlc_json_data.append({
                          "name": title,
                          "logo": thumb,
                          "link": url,
                          "cookie": session_key
                      })

                      # Build Raw M3U String (Correct format for NS Player)
                      m3u_final += f'#EXTINF:-1 group-title="{genre}" tvg-logo="{thumb}", {title}\n'
                      m3u_final += f'#EXTVLCOPT:http-user-agent={os.environ.get("UA_MOBILE")}\n'
                      m3u_final += f'#EXTVLCOPT:http-cookie={session_key}\n'
                      m3u_final += f'{url}\n\n'

                  # Write as RAW M3U Text (Not JSON)
                  with open("Toffee_NS_Player.m3u", "w", encoding="utf-8") as f:
                      f.write(m3u_final)

                  with open("Toffee_Ott_Navigator.m3u", "w", encoding="utf-8") as f:
                      f.write(m3u_final)

                  # Keep channels.json as standard JSON
                  with open("channels.json", "w", encoding="utf-8") as f:
                      json.dump(vlc_json_data, f, indent=4)

                  print("[+] Deployment successful. Formats corrected.")

              except Exception as err:
                  print(f"[!] Runtime Exception: {err}")
                  sys.exit(1)

          if __name__ == "__main__":
              run_secured_sync()
          EOF

      - name: Commit and Broadcast
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Sync Bot"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "System Sync: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          else
            echo "No changes detected."
          fi
