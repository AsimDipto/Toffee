name: "Advanced IPTV Core Engine - V2.1"

# Trigger points for maximum reliability
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force clean synchronization'
        required: false
        default: 'false'

# Global Environment Variables
env:
  PYTHON_VER: '3.11'
  REPO_OWNER: "System-Sync-Engine"
  CH_DATA: "api.json"

jobs:
  Initialize-and-Deploy:
    name: "Data Processing Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: ">> Step 1: Secure Repository Fetch"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ">> Step 2: High Performance Python Runtime"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: 'pip'

      - name: ">> Step 3: Core Dependency Injection"
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3
          echo "[INFO] Dependencies loaded successfully."

      - name: ">> Step 4: Execution of Main Logic Engine"
        id: engine_run
        run: |
          python3 - << 'EOF'
          import requests, json, os, sys, time
          from datetime import datetime

          # Internal Config
          BASE_ENDPOINT = "https://apis.allinonedev.top/tf/"
          M3U_HEADER = "#EXTM3U\n"
          UA_HEADER = "Toffee (Linux;Android 14)"

          def process_engine():
              print(f"[*] Starting Sync at: {datetime.now()}")
              
              try:
                  # Logic: Session Authentication
                  session = requests.Session()
                  auth_res = session.get(BASE_ENDPOINT, timeout=25)
                  token = auth_res.json().get("set_cookie", "")
                  
                  if not token:
                      print("[ERROR] Authentication Token Rejected."); return
                  
                  # Logic: Data Source Verification
                  if not os.path.exists("api.json"):
                      print("[WARN] Local Database (api.json) missing."); return

                  with open("api.json", "r", encoding="utf-8") as f:
                      raw_data = json.load(f)

                  processed_payload = []
                  ott_buffer = [M3U_HEADER]

                  # Logic: Parallel Stream Transformation
                  for index, stream in enumerate(raw_data):
                      m3u8_url = stream.get("link")
                      if not m3u8_url: continue

                      title = stream.get("name", "Stream")
                      icon = stream.get("logo", "")
                      group = stream.get("category_name", "TV")

                      # Standardized Schema
                      entry = {
                          "id": index + 101,
                          "name": title,
                          "logo": icon,
                          "link": m3u8_url,
                          "cookie": token,
                          "timestamp": str(datetime.now())
                      }
                      processed_payload.append(entry)

                      # OTT Integration
                      ott_buffer.append(f'#EXTINF:-1 group-title="{group}" tvg-logo="{icon}", {title}\n')
                      ott_buffer.append(f'#EXTVLCOPT:http-user-agent={UA_HEADER}\n')
                      ott_buffer.append(f'#EXTVLCOPT:http-cookie={token}\n')
                      ott_buffer.append(f'{m3u8_url}\n')

                  # Output Management (No tengo.json)
                  with open("Toffee_NS_Player.m3u", "w", encoding="utf-8") as f:
                      json.dump(processed_payload, f, separators=(',', ':'))

                  with open("channels.json", "w", encoding="utf-8") as f:
                      json.dump(processed_payload, f, indent=2)

                  with open("Toffee_Ott_Navigator.m3u", "w", encoding="utf-8") as f:
                      f.write("".join(ott_buffer))

                  print(f"[SUCCESS] Total Streams Processed: {len(processed_payload)}")

              except Exception as fatal_err:
                  print(f"[CRITICAL] Kernel Panic: {fatal_err}")
                  sys.exit(1)

          if __name__ == "__main__":
              process_engine()
          EOF

      - name: ">> Step 5: System Health Monitoring"
        run: |
          echo "Verifying file integrity..."
          [ -f "channels.json" ] && echo "channels.json exists." || exit 1
          [ -f "Toffee_Ott_Navigator.m3u" ] && echo "Playlist generated." || exit 1

      - name: ">> Step 6: Atomic Commit & Origin Push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "bot-service@github.com"
          git config --local user.name "AI-Automator-Core"
          git add .
          if ! git diff-index --quiet HEAD; then
            STAMP=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "Build: $STAMP [CI Skip]"
            git push origin main
          else
            echo "Deployment: No changes found. Infrastructure is up-to-date."
          fi
